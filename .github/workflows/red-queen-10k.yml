name: Red Queen 10K Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Read-only for PR scanning; write only for the 10K test result commit
# (which goes to a separate branch, not the PR branch)
permissions:
  contents: read
  pull-requests: read
  checks: write  # needed to annotate PR with test results — does NOT touch repo contents

jobs:
  red-queen-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Red Queen Docker image
        working-directory: red_queen_sentry
        run: docker build -t red-queen .

      - name: Verify privilege drop (uid 10001)
        run: |
          UID_CHECK=$(docker run --rm red-queen id -u)
          if [ "$UID_CHECK" != "10001" ]; then
            echo "FAIL: container running as uid $UID_CHECK, expected 10001"
            exit 1
          fi
          echo "OK: container running as uid 10001 (sentryuser)"

      - name: Verify no sudo access
        run: |
          if docker run --rm red-queen sudo -n true 2>/dev/null; then
            echo "FAIL: sentryuser has sudo access"
            exit 1
          fi
          echo "OK: no sudo access for sentryuser"

      - name: Run 10K prompt-injection test
        run: |
          CONTAINER_ID=$(docker create \
            --network=none \
            --read-only \
            --memory=512m \
            --cpus=1.0 \
            --security-opt no-new-privileges \
            red-queen python /app/red_queen_sentry/run_10k.py \
              --iterations 10000 \
              --seed 42 \
              --output /tmp/results.json)
          docker start -a "$CONTAINER_ID"
          docker cp "$CONTAINER_ID":/tmp/results.json /tmp/results.json
          docker rm "$CONTAINER_ID"

      - name: Check results — zero breaches required
        run: |
          RESULTS=$(cat /tmp/results.json 2>/dev/null || echo '{"breaches": -1}')
          BREACHES=$(echo "$RESULTS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('breaches', -1))")
          if [ "$BREACHES" != "0" ]; then
            echo "FAIL: $BREACHES breaches detected in 10,000 iterations — zero tolerance violated"
            exit 1
          fi
          echo "OK: 0 breaches in 10,000 iterations"

      - name: Verify GITHUB_TOKEN read-only in all untrusted-input workflows
        run: |
          for f in .github/workflows/red_queen_sentry.yml; do
            if grep -q "contents: write\|issues: write\|pull-requests: write" "$f"; then
              echo "FAIL: $f has write permissions for untrusted-input workflow"
              exit 1
            fi
          done
          echo "OK: all untrusted-input workflows have read-only GITHUB_TOKEN"
