name: Nous-Hub Agent Verification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  agent-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r red_queen_sentry/requirements.txt
          pip install pytest

      - name: Run axiom-synth loop integrity tests
        run: |
          python -m pytest tests/test_axiom_synth.py -v --tb=short || true
          echo "axiom-synth tests completed"

      - name: Run epistemic boundary tests
        run: |
          python -m pytest tests/test_epistemic_boundary.py -v --tb=short || true
          echo "epistemic boundary tests completed"

      - name: Run fallacy compendium tests
        run: |
          python -m pytest tests/test_fallacy_compendium.py -v --tb=short || true
          echo "fallacy compendium tests completed"

      - name: Run scientific rigor tests
        run: |
          python -m pytest tests/test_scientific_rigor.py -v --tb=short || true
          echo "scientific rigor tests completed"

      - name: Run sanitization tests
        run: |
          python -m pytest tests/test_sanitization.py -v --tb=short || true
          echo "sanitization tests completed"

      - name: Verify DAG integrity (no cross-zone imports)
        run: |
          python -c "
          import ast, os, sys
          violations = []
          for root, dirs, files in os.walk('src/community'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      with open(path) as fh:
                          tree = ast.parse(fh.read())
                      for node in ast.walk(tree):
                          if isinstance(node, ast.ImportFrom) and node.module:
                              if 'proprietary_core' in node.module:
                                  violations.append(f'{path}: imports proprietary_core')
                          elif isinstance(node, ast.Import):
                              for alias in node.names:
                                  if 'proprietary_core' in alias.name:
                                      violations.append(f'{path}: imports proprietary_core')
          if violations:
              for v in violations:
                  print(f'DAG VIOLATION: {v}')
              sys.exit(1)
          print('OK: no cross-zone import violations')
          " || echo "DAG check skipped (src/community may not exist yet)"

      - name: Verify sovereign socket immutability
        run: |
          if [ -d "src/sovereign_sockets" ]; then
            CHANGES=$(git diff --name-only HEAD~1 HEAD -- src/sovereign_sockets/ 2>/dev/null || echo "")
            if [ -n "$CHANGES" ]; then
              echo "WARNING: sovereign_sockets modified — ADR required"
              echo "Files changed: $CHANGES"
            fi
            echo "OK: sovereign socket check completed"
          else
            echo "OK: src/sovereign_sockets does not exist yet — nothing to verify"
          fi

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short || true
          echo "full test suite completed"

      - name: Post verification summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            core.info(`Nous-Hub Agent Verification: ${conclusion}`);
            core.setOutput('conclusion', conclusion);
