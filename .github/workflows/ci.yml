name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Honesty policy: checks marked [blocking] fail the build on failure.
# Checks marked [report] are informational debt trackers — they annotate the
# run but never silently convert a failure into a pass. No `|| true` anywhere:
# a failing report step uses continue-on-error so the job stays green ONLY for
# tracked debt, while real regressions (tests, pyflakes, DAG) always block.
jobs:
  lint:
    name: Lint (pyflakes-critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ruff mypy pytest
          pip install -r red_queen_sentry/requirements.txt

      # [blocking] F = genuine defects (undefined names, unused vars,
      # redefinitions); E9 = syntax errors. These must never regress.
      - name: Run ruff (correctness rules — blocking)
        run: ruff check --select F,E9,W605 --output-format=github .

  type-check:
    name: Type Check (report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mypy pytest
          pip install -r red_queen_sentry/requirements.txt

      # [report] Full strict mypy is tracked debt (66 known findings).
      # Failures are reported in the job log; they do not block merges yet.
      - name: Run mypy (non-blocking report)
        continue-on-error: true
        run: mypy --ignore-missing-imports --no-error-summary src/ red_queen_sentry/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r red_queen_sentry/requirements.txt

      # [blocking] The test suite must pass. A red X here is a real failure.
      - name: Run tests
        env:
          PYTHONHASHSEED: '0'
        run: PYTHONPATH=src pytest tests/ -v --tb=short --maxfail=10

      - name: Verify DAG integrity (no cross-zone imports) — blocking
        run: |
          python -c "
          import ast, os, sys
          violations = []
          community = os.path.join(os.getcwd(), 'src', 'community')
          if not os.path.isdir(community):
              print('OK: src/community does not exist yet')
              sys.exit(0)
          for root, dirs, files in os.walk(community):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      with open(path) as fh:
                          tree = ast.parse(fh.read())
                      for node in ast.walk(tree):
                          if isinstance(node, ast.ImportFrom) and node.module:
                              if 'proprietary_core' in node.module:
                                  violations.append(f'{path}: imports proprietary_core')
                          elif isinstance(node, ast.Import):
                              for alias in node.names:
                                  if 'proprietary_core' in alias.name:
                                      violations.append(f'{path}: imports proprietary_core')
          if violations:
              for v in violations:
                  print(f'DAG VIOLATION: {v}')
              sys.exit(1)
          print('OK: no cross-zone import violations')
          "
